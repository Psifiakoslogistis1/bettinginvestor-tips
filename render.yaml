services:
  - type: web
    name: tips-app-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true
      - key: STUB_BILLING
        value: "true"
      - key: ADMIN_EMAIL
        value: bettinginvestor@hotmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tips-app-db
          property: connectionString
databases:
  - name: tips-app-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
