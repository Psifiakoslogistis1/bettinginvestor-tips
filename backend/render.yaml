services:
  - type: web
    name: tips-app-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: tips-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: STUB_BILLING
        value: "true"
      - key: ADMIN_EMAIL
        value: bettinginvestor@hotmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "20"
